[package]
name = "hghub-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "PolyForm-Noncommercial-1.0.0"

# 纯 Rust 核心模块来自 ../src-tauri/src（由 sync-core.sh 同步到 src/core/）。
# 模块挂在 crate root，保证源码里的 crate::net / crate::playback_log 等引用原样可用。
[[bin]]
name = "hghub-web"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
